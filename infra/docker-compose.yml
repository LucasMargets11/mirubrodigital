services:
  postgres:
    image: postgres:16-alpine
    container_name: mirubro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mirubro}
      POSTGRES_USER: ${POSTGRES_USER:-mirubro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mirubro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mirubro} -d ${POSTGRES_DB:-mirubro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mirubro-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../services/api
      target: runtime
    container_name: mirubro-api
    restart: unless-stopped
    command: sh -c "python manage.py migrate && exec gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile - --error-logfile - config.wsgi:application"
    env_file:
      - ../services/api/.env
    volumes:
      - ../generated:/app/generated:ro
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
        API_HOSTNAME: api
        NEXT_PUBLIC_NEW_ONBOARDING_ENABLED: "true"
        NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID}
        NEXT_PUBLIC_AUTH_BETA_GOOGLE_ONLY: ${NEXT_PUBLIC_AUTH_BETA_GOOGLE_ONLY}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    container_name: mirubro-web
    restart: unless-stopped
    env_file:
      - ../apps/web/.env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      API_URL: http://api:8000
      API_INTERNAL_URL: http://api:8000
      API_URL_INTERNAL: http://api:8000
      INTERNAL_API_URL: http://api:8000
      API_HOSTNAME: api
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_started

  celery-worker:
    build:
      context: ../services/api
      target: runtime
    container_name: mirubro-celery-worker
    restart: unless-stopped
    command: celery -A config worker -l info -Q celery --concurrency=2
    env_file:
      - ../services/api/.env
    volumes:
      - ../generated:/app/generated:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ../services/api
      target: runtime
    container_name: mirubro-celery-beat
    restart: unless-stopped
    command: celery -A config beat -l info --pidfile=/tmp/celerybeat.pid
    env_file:
      - ../services/api/.env
    volumes:
      - ../generated:/app/generated:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ngrok:
    image: ngrok/ngrok:latest
    container_name: mirubro-ngrok
    profiles:
      - tunnel
    command: http api:8000 --log=stdout
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    ports:
      - '4040:4040'
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
