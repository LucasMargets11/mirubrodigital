<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="900" y2="506" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f766e" flood-opacity="0.15"/>
    </filter>
    <filter id="card3" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0d9488" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="506" fill="url(#bg3)"/>

  <!-- Blobs -->
  <circle cx="820" cy="90" r="130" fill="#0d9488" opacity="0.06"/>
  <circle cx="80" cy="430" r="100" fill="#4f46e5" opacity="0.05"/>

  <!-- ===== TABLE / STICKER STAND (left-center) ===== -->
  <!-- Stand base -->
  <ellipse cx="240" cy="450" rx="70" ry="12" fill="#0d9488" opacity="0.15"/>
  <!-- Stand post -->
  <rect x="232" y="340" width="16" height="114" rx="4" fill="#ccfbf1" stroke="#99f6e4" stroke-width="2"/>
  <!-- Stand card frame -->
  <g filter="url(#shadow3)">
    <rect x="160" y="160" width="160" height="190" rx="16" fill="white" stroke="#99f6e4" stroke-width="2"/>
  </g>
  <!-- QR code representation -->
  <text x="240" y="206" font-family="system-ui, sans-serif" font-size="10" fill="#0d9488" text-anchor="middle" font-weight="700">Escaneá para</text>
  <text x="240" y="220" font-family="system-ui, sans-serif" font-size="10" fill="#0d9488" text-anchor="middle" font-weight="700">dejar tu reseña</text>

  <!-- QR code grid -->
  <g transform="translate(196, 228)">
    <!-- Corner marks -->
    <rect x="0" y="0" width="18" height="18" rx="3" fill="none" stroke="#0d9488" stroke-width="2.5"/>
    <rect x="3" y="3" width="12" height="12" rx="2" fill="#0d9488"/>
    <rect x="69" y="0" width="18" height="18" rx="3" fill="none" stroke="#0d9488" stroke-width="2.5"/>
    <rect x="72" y="3" width="12" height="12" rx="2" fill="#0d9488"/>
    <rect x="0" y="69" width="18" height="18" rx="3" fill="none" stroke="#0d9488" stroke-width="2.5"/>
    <rect x="3" y="72" width="12" height="12" rx="2" fill="#0d9488"/>
    <!-- Dots pattern -->
    <rect x="24" y="4" width="5" height="5" rx="1" fill="#0d9488"/>
    <rect x="34" y="4" width="5" height="5" rx="1" fill="#0d9488"/>
    <rect x="44" y="4" width="5" height="5" rx="1" fill="#0d9488"/>
    <rect x="24" y="14" width="5" height="5" rx="1" fill="#0d9488"/>
    <rect x="44" y="14" width="5" height="5" rx="1" fill="#0d9488"/>
    <rect x="4" y="24" width="5" height="5" rx="1" fill="#0d9488"/>
    <rect x="4" y="34" width="5" height="5" rx="1" fill="#0d9488"/>
    <rect x="14" y="44" width="5" height="5" rx="1" fill="#0d9488"/>
    <rect x="24" y="24" width="5" height="5" rx="1" fill="#0d9488"/>
    <rect x="34" y="34" width="5" height="5" rx="1" fill="#0d9488"/>
    <rect x="44" y="44" width="5" height="5" rx="1" fill="#0d9488"/>
    <rect x="54" y="24" width="5" height="5" rx="1" fill="#0d9488"/>
    <rect x="64" y="34" width="5" height="5" rx="1" fill="#0d9488"/>
    <rect x="74" y="24" width="5" height="5" rx="1" fill="#0d9488"/>
    <rect x="74" y="44" width="5" height="5" rx="1" fill="#0d9488"/>
    <rect x="24" y="74" width="5" height="5" rx="1" fill="#0d9488"/>
    <rect x="34" y="64" width="5" height="5" rx="1" fill="#0d9488"/>
    <rect x="44" y="74" width="5" height="5" rx="1" fill="#0d9488"/>
    <rect x="54" y="54" width="5" height="5" rx="1" fill="#0d9488"/>
    <rect x="64" y="64" width="5" height="5" rx="1" fill="#0d9488"/>
    <rect x="74" y="74" width="5" height="5" rx="1" fill="#0d9488"/>
  </g>

  <!-- ===== Arrow ===== -->
  <g opacity="0.8">
    <path d="M 332 290 Q 390 270 420 290" stroke="#0d9488" stroke-width="3" stroke-dasharray="6 4" fill="none" stroke-linecap="round"/>
    <polygon points="418,282 430,292 418,302" fill="#0d9488"/>
  </g>

  <!-- ===== Phone (right of center) ===== -->
  <g filter="url(#shadow3)">
    <rect x="430" y="80" width="220" height="360" rx="28" fill="#134e4a"/>
  </g>
  <rect x="438" y="88" width="204" height="344" rx="22" fill="url(#cardGrad)"/>
  <rect x="494" y="88" width="96" height="14" rx="7" fill="#134e4a"/>

  <!-- Phone app bar -->
  <rect x="438" y="102" width="204" height="44" rx="0" fill="#0d9488"/>
  <text x="540" y="128" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">Reseñar local</text>

  <!-- Review prompt card -->
  <g filter="url(#card3)">
    <rect x="448" y="158" width="184" height="72" rx="12" fill="white"/>
  </g>
  <text x="540" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e1b4b" text-anchor="middle">La Barra · Café</text>
  <text x="540" y="196" font-family="system-ui, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">¿Cómo fue tu experiencia?</text>
  <!-- Stars interactive -->
  <text x="490" y="220" font-family="system-ui" font-size="20" fill="#f59e0b">★★★★★</text>

  <!-- Text input area -->
  <rect x="448" y="242" width="184" height="68" rx="10" fill="#f8fffe" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="458" y="262" font-family="system-ui, sans-serif" font-size="9" fill="#9ca3af">Contá tu experiencia...</text>
  <text x="458" y="276" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">"Una atención increíble y el</text>
  <text x="458" y="288" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">café fue excelente"</text>
  <line x1="458" y1="296" x2="590" y2="296" stroke="#0d9488" stroke-width="1.5" opacity="0.4"/>

  <!-- Submit button -->
  <rect x="448" y="322" width="184" height="38" rx="10" fill="#0d9488"/>
  <text x="540" y="345" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle">Publicar reseña →</text>

  <!-- Sent confirmation state (faded below) -->
  <circle cx="540" cy="388" r="20" fill="#ecfdf5"/>
  <text x="540" y="394" font-family="system-ui" font-size="14" fill="#059669" text-anchor="middle">✓</text>
  <text x="540" y="416" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">¡Gracias por tu reseña!</text>

  <!-- Left info cards -->
  <g filter="url(#card3)">
    <rect x="50" y="120" width="200" height="88" rx="16" fill="white"/>
  </g>
  <text x="70" y="148" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e1b4b">Sin carta online</text>
  <text x="70" y="165" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">Solo el QR de reseñas.</text>
  <text x="70" y="178" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">Implementación en minutos.</text>
  <rect x="70" y="190" width="78" height="14" rx="7" fill="#ccfbf1"/>
  <text x="109" y="200" font-family="system-ui, sans-serif" font-size="8" fill="#0d9488" text-anchor="middle" font-weight="600">Fácil adopción</text>

  <!-- Right floating card -->
  <g filter="url(#card3)">
    <rect x="668" y="140" width="190" height="90" rx="16" fill="white"/>
  </g>
  <text x="688" y="168" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e1b4b">Nuevas reseñas</text>
  <text x="688" y="192" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#0d9488">+34</text>
  <text x="688" y="212" font-family="system-ui, sans-serif" font-size="9" fill="#9ca3af">en el último mes</text>

  <!-- Bottom right card -->
  <g filter="url(#card3)">
    <rect x="668" y="250" width="190" height="80" rx="16" fill="white"/>
  </g>
  <text x="688" y="274" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e1b4b">Presencia digital</text>
  <text x="688" y="292" font-family="system-ui" font-size="14" fill="#f59e0b">★★★★½</text>
  <text x="688" y="308" font-family="system-ui, sans-serif" font-size="9" fill="#9ca3af">visibilidad en buscadores</text>

  <!-- Title block bottom-left -->
  <text x="70" y="310" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#134e4a">QR de Reseñas</text>
  <text x="70" y="336" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#0d9488">sin carta online</text>
  <text x="70" y="358" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">La entrada más simple al</text>
  <text x="70" y="373" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">ecosistema digital</text>

  <!-- Mirubro tag -->
  <rect x="52" y="440" width="120" height="22" rx="11" fill="#0d9488" opacity="0.12"/>
  <text x="112" y="455" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#0d9488" text-anchor="middle" letter-spacing="2">MIRUBRO</text>
</svg>
