{% extends "emails/base.html" %}

{% block subject %}{{ title|default:"Notificación de MiRubro" }}{% endblock %}

{% block content %}
  <h2 style="margin:0 0 16px;font-size:20px;font-weight:bold;color:#111827;line-height:1.3;">
    {{ title|default:"Hola" }}
  </h2>

  {% if message %}
  <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#374151;">
    {{ message }}
  </p>
  {% endif %}

  {% if action_url and action_label %}
  <table cellpadding="0" cellspacing="0" style="margin:0 0 24px;">
    <tr>
      <td style="background-color:#1a56db;border-radius:6px;">
        <a href="{{ action_url }}"
           style="display:inline-block;padding:12px 24px;color:#ffffff;font-size:15px;font-weight:bold;text-decoration:none;">
          {{ action_label }}
        </a>
      </td>
    </tr>
  </table>
  {% endif %}
{% endblock %}
